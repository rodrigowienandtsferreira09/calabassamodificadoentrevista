name: Security audit

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Audit backend
        working-directory: backend
        run: npm ci && npm audit --audit-level=high

      - name: Audit web
        working-directory: web
        run: npm ci && npm audit --audit-level=high
